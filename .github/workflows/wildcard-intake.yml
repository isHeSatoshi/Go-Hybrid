# Wildcard Track intake labels — BOUNTY.md Track 3, ledger in MOONSHOT.md.
#
# The wildcard issue form declares its own routing labels:
#
#     title: "[wildcard] "
#     labels: ["wildcard", "💎 Bounty"]
#
# GitHub applies those labels ONLY when an issue is created through the web
# template chooser. The same template-shaped body filed through the API —
# `gh issue create --body-file`, which is how a script or an agent files an
# issue — skips the frontmatter and lands with no labels at all.
#
# That decides eligibility, because the label is the routing key into triage.
# Measured on 2026-10-18 against MOONSHOT.md's ledger, and confirmed by the
# second intake batch (ledger commit 2026-10-17T20:24), where ten proposals
# were available to the same triage pass:
#
#     taken   : #375 #378 #417 #462  — all four labeled (#375 hand-labeled at
#               20:23, one minute before the commit)
#     skipped : #394 #428 #448 #458 #471 #482 — all six unlabeled
#
# Every proposal ever processed carries the label; no unlabeled proposal has
# ever been processed. The label may be a byproduct of processing rather than
# the gate, but either way an unlabeled proposal is indistinguishable from an
# unprocessed one — and 14 are in that state today.
#
# Both jobs read the labels and the title prefix from the form at runtime via
# tools/wildcard_intake.py, so this workflow cannot drift from the template:
# change the form and this follows, with no second copy to forget. Neither job
# hardcodes a label or a prefix, which is why the on-open job has no cheap
# title gate — the predicate is the tool's, not a copy of it in YAML.
name: wildcard intake

on:
  issues:
    types: [opened]
  # Self-healing: a proposal that still arrives unlabeled is corrected within
  # the hour rather than waiting for someone to notice. The form already
  # declares these labels, so applying them is not a new decision — it is the
  # template's own intent, executed on the paths the template cannot reach.
  schedule:
    - cron: '17 * * * *'
  # Manual run, for backfilling on demand.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Overlapping runs would race on the same issues; the work is idempotent but
# there is no reason to do it twice at once.
concurrency:
  group: wildcard-intake
  cancel-in-progress: false

jobs:
  label-new-proposal:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (pinned v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply the labels the wildcard form declares
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Re-read the issue through gh rather than interpolating its title
          # into JSON here: a title containing a quote or a backslash would
          # break a hand-built document, and this runs on every new issue.
          gh issue view "$ISSUE" --repo "$REPO" \
            --json number,title,labels > /tmp/one.json
          python3 tools/wildcard_intake.py --select < /tmp/one.json > /tmp/todo.txt
          if [ ! -s /tmp/todo.txt ]; then
            echo "issue #$ISSUE is not an unlabelled wildcard proposal; nothing to do"
            exit 0
          fi
          IFS=: read -r number labels < /tmp/todo.txt
          args=()
          IFS=',' read -ra parts <<< "$labels"
          for lb in "${parts[@]}"; do args+=(--add-label "$lb"); done
          echo "labelling #$number with: ${parts[*]}"
          gh issue edit "$number" --repo "$REPO" "${args[@]}"

  backfill-existing-proposals:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (pinned v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Label every open proposal that is missing its routing labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          gh issue list --repo "$REPO" --state open --limit 1000 \
            --json number,title,labels > /tmp/wildcard-issues.json
          python3 tools/wildcard_intake.py --select \
            < /tmp/wildcard-issues.json > /tmp/todo.txt
          if [ ! -s /tmp/todo.txt ]; then
            echo "every open wildcard proposal already carries its labels"
            exit 0
          fi
          echo "proposals missing labels:"
          cat /tmp/todo.txt
          while IFS=: read -r number labels; do
            [ -n "$number" ] || continue
            args=()
            IFS=',' read -ra parts <<< "$labels"
            for lb in "${parts[@]}"; do args+=(--add-label "$lb"); done
            echo "labelling #$number with: ${parts[*]}"
            gh issue edit "$number" --repo "$REPO" "${args[@]}"
          done < /tmp/todo.txt
          echo "done"
